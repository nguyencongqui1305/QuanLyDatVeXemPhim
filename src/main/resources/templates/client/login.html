<!DOCTYPE html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/main-layout}">
<head layout:fragment="head-extra">
    <title th:text="${pageTitle}">Đăng nhập - UTC Cinema</title>
</head>
<body>
<main layout:fragment="content">
<div class="auth-container">
    <div class="auth-card animate-fade-up">
        <!-- Logo -->
        <div class="auth-logo"><i class="fas fa-film me-2"></i>UTC Cinema</div>
        <div class="auth-subtitle">Đăng nhập để đặt vé và nhận ưu đãi</div>

        <!-- Error / Success alerts -->
        <div th:if="${param.error}" class="alert mb-3" style="background:rgba(229,9,20,0.1);border:1px solid rgba(229,9,20,0.3);color:#ff4d4d;border-radius:10px;padding:12px 16px;font-size:0.88rem">
            <i class="fas fa-exclamation-circle me-2"></i>Email hoặc mật khẩu không đúng. Vui lòng thử lại.
        </div>
        <div th:if="${param.logout}" class="alert mb-3" style="background:rgba(70,211,105,0.1);border:1px solid rgba(70,211,105,0.3);color:#46d369;border-radius:10px;padding:12px 16px;font-size:0.88rem">
            <i class="fas fa-check-circle me-2"></i>Bạn đã đăng xuất thành công.
        </div>
        <div th:if="${successMessage}" class="alert mb-3" style="background:rgba(70,211,105,0.1);border:1px solid rgba(70,211,105,0.3);color:#46d369;border-radius:10px;padding:12px 16px;font-size:0.88rem">
            <i class="fas fa-check-circle me-2"></i><span th:text="${successMessage}"></span>
        </div>

        <!-- Login Form -->
        <form th:action="@{/login}" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

            <div class="mb-3">
                <label class="form-label-dark" for="emailInput">Email</label>
                <div style="position:relative">
                    <i class="fas fa-envelope" style="position:absolute;left:14px;top:50%;transform:translateY(-50%);color:#666"></i>
                    <input type="email" id="emailInput" name="email" required
                           class="form-control-dark form-control" style="padding-left:40px"
                           placeholder="your@email.com" autocomplete="email"/>
                </div>
            </div>

            <div class="mb-4">
                <label class="form-label-dark" for="passwordInput">Mật khẩu</label>
                <div style="position:relative">
                    <i class="fas fa-lock" style="position:absolute;left:14px;top:50%;transform:translateY(-50%);color:#666"></i>
                    <input type="password" id="passwordInput" name="password" required
                           class="form-control-dark form-control" style="padding-left:40px;padding-right:44px"
                           placeholder="••••••••" autocomplete="current-password"/>
                    <button type="button" onclick="togglePassword('passwordInput')"
                            style="position:absolute;right:14px;top:50%;transform:translateY(-50%);background:none;border:none;color:#666;cursor:pointer">
                        <i class="fas fa-eye" id="eyeIcon"></i>
                    </button>
                </div>
            </div>

            <button type="submit" class="btn-cinema w-100" style="padding:13px;font-size:0.95rem;justify-content:center">
                <i class="fas fa-sign-in-alt"></i>Đăng nhập
            </button>
        </form>

        <div class="text-center mt-4" style="color:#666;font-size:0.88rem">
            Chưa có tài khoản?
            <a th:href="@{/register}" style="color:#e50914;text-decoration:none;font-weight:600">Đăng ký ngay</a>
        </div>

        <!-- Demo accounts -->
        <div style="background:#111;border:1px solid #222;border-radius:10px;padding:14px;margin-top:20px">
            <div style="color:#666;font-size:0.75rem;text-transform:uppercase;letter-spacing:1px;margin-bottom:10px">Tài khoản demo</div>
            <div style="font-size:0.78rem;color:#b3b3b3;line-height:1.8">
                <div><span style="color:#46d369">Khách hàng:</span> an.nguyen@email.com / 123456</div>
                <div><span style="color:#f5c518">Quản lý:</span> quanly@utccinema.vn / 123456</div>
                <div><span style="color:#5b9bd5">Nhân viên:</span> banve@utccinema.vn / 123456</div>
            </div>
        </div>
    </div>
</div>
</main>
<th:block layout:fragment="scripts">
<script>
function togglePassword(id) {
    const input = document.getElementById(id);
    const icon = document.getElementById('eyeIcon');
    if (input.type === 'password') {
        input.type = 'text';
        icon.className = 'fas fa-eye-slash';
    } else {
        input.type = 'password';
        icon.className = 'fas fa-eye';
    }
}
</script>
</th:block>
</body>
</html>
