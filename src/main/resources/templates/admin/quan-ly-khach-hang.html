<!DOCTYPE html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/admin-layout}">
<head layout:fragment="head-extra"></head>
<body>
<div layout:fragment="content">
    <div class="admin-topbar">
        <div class="admin-page-title"><i class="fas fa-users me-2" style="color:#e50914"></i>Quản lý khách hàng</div>
    </div>
    <div class="card-dark">
        <div class="table-responsive">
            <table class="table-dark-utc">
                <thead>
                    <tr>
                        <th>Mã KH</th>
                        <th>Họ tên</th>
                        <th>SĐT</th>
                        <th>Email</th>
                        <th>Ngày đăng ký</th>
                        <th>Thao tác</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="kh : ${danhSachKH}">
                        <td style="color:#666;font-size:0.8rem" th:text="${kh.maKh}"></td>
                        <td style="font-weight:600" th:text="${kh.hoTen}"></td>
                        <td th:text="${kh.sdt}"></td>
                        <td style="color:#b3b3b3;font-size:0.85rem" th:text="${kh.email}"></td>
                        <td style="font-size:0.85rem" th:text="${kh.ngayDangKy != null ? #temporals.format(kh.ngayDangKy, 'dd/MM/yyyy') : '-'}"></td>
                        <td>
                            <form th:action="@{/admin/khach-hang/xoa/{id}(id=${kh.maKh})}" method="post" style="display:inline"
                                  onsubmit="return confirm('Xóa khách hàng này? Dữ liệu đặt vé liên quan cũng sẽ bị ảnh hưởng!')">
                                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                                <button type="submit"
                                        style="background:#1a1a1a;border:1px solid #333;color:#e50914;padding:5px 10px;border-radius:6px;cursor:pointer;font-size:0.78rem;transition:0.2s"
                                        onmouseover="this.style.background='rgba(229,9,20,0.15)'"
                                        onmouseout="this.style.background='#1a1a1a'">
                                    <i class="fas fa-trash"></i>
                                </button>
                            </form>
                        </td>
                    </tr>
                    <tr th:if="${danhSachKH == null or danhSachKH.isEmpty()}">
                        <td colspan="6" style="text-align:center;color:#444;padding:40px">Chưa có khách hàng nào</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
</body>
</html>
