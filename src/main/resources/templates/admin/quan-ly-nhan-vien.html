<!DOCTYPE html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/admin-layout}">
<head layout:fragment="head-extra"></head>
<body>
<div layout:fragment="content">
    <div class="admin-topbar">
        <div class="admin-page-title"><i class="fas fa-user-tie me-2" style="color:#e50914"></i>Quản lý nhân viên</div>
        <button class="btn-cinema" data-bs-toggle="modal" data-bs-target="#addStaffModal">
            <i class="fas fa-plus"></i>Thêm nhân viên
        </button>
    </div>
    <div class="card-dark">
        <div class="table-responsive">
            <table class="table-dark-utc">
                <thead>
                    <tr>
                        <th>Mã NV</th><th>Họ tên</th><th>Chức vụ</th><th>Rạp</th><th>SĐT</th><th>Email</th><th>Trạng thái</th><th>Thao tác</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="nv : ${danhSachNV}">
                        <td style="color:#666;font-size:0.8rem" th:text="${nv.maNv}"></td>
                        <td style="font-weight:600" th:text="${nv.hoTen}"></td>
                        <td>
                            <span class="badge-status"
                                  th:class="${nv.chucVu == 'QUAN_LY' ? 'badge-status badge-warning' : 'badge-status badge-info'}"
                                  th:text="${nv.chucVu == 'QUAN_LY' ? 'Quản lý' : 'Nhân viên'}"></span>
                        </td>
                        <td style="font-size:0.85rem" th:text="${nv.rapChieu?.tenRap}"></td>
                        <td th:text="${nv.sdt}"></td>
                        <td style="color:#b3b3b3;font-size:0.85rem" th:text="${nv.email}"></td>
                        <td>
                            <span class="badge-status"
                                  th:class="${nv.trangThai == 'Đã khóa' ? 'badge-status badge-danger' : 'badge-status badge-success'}"
                                  th:text="${nv.trangThai == 'Đã khóa' ? 'Đã khóa' : 'Hoạt động'}"></span>
                        </td>
                        <td style="white-space:nowrap">
                            <button type="button"
                                    style="background:#1a1a1a;border:1px solid #333;color:#5b9bd5;padding:5px 10px;border-radius:6px;cursor:pointer;font-size:0.78rem;margin-right:4px"
                                    th:attr="onclick=|openEditModal('${nv.maNv}','${nv.hoTen}','${nv.email}','${nv.sdt}','${nv.chucVu}','${nv.rapChieu?.maRap}')|">
                                <i class="fas fa-edit"></i>
                            </button>
                            <form th:action="@{/admin/nhan-vien/khoa/{id}(id=${nv.maNv})}" method="post" style="display:inline"
                                  onsubmit="return confirm('Đổi trạng thái khóa/mở tài khoản này?')">
                                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                                <button type="submit"
                                        style="background:#1a1a1a;border:1px solid #333;color:#f5c518;padding:5px 10px;border-radius:6px;cursor:pointer;font-size:0.78rem;margin-right:4px">
                                    <i th:class="${nv.trangThai == 'Đã khóa' ? 'fas fa-unlock' : 'fas fa-lock'}"></i>
                                </button>
                            </form>
                            <form th:action="@{/admin/nhan-vien/xoa/{id}(id=${nv.maNv})}" method="post" style="display:inline"
                                  onsubmit="return confirm('Xóa nhân viên này?')">
                                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                                <button type="submit"
                                        style="background:#1a1a1a;border:1px solid #333;color:#e50914;padding:5px 10px;border-radius:6px;cursor:pointer;font-size:0.78rem">
                                    <i class="fas fa-trash"></i>
                                </button>
                            </form>
                        </td>
                    </tr>
                    <tr th:if="${danhSachNV == null or danhSachNV.isEmpty()}">
                        <td colspan="8" style="text-align:center;color:#444;padding:40px">Chưa có nhân viên nào</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- Modal Thêm nhân viên - PHAI nam trong layout:fragment="content" -->
    <div class="modal fade" id="addStaffModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-lg">
            <div class="modal-content" style="background:#1a1a1a;border:1px solid #2a2a2a;color:#fff">
                <div class="modal-header" style="border-color:#2a2a2a">
                    <h5 class="modal-title"><i class="fas fa-user-plus me-2" style="color:#e50914"></i>Thêm nhân viên mới</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <form th:action="@{/admin/nhan-vien/them}" method="post">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                    <div class="modal-body">
                        <div class="row g-3">
                            <div class="col-md-6">
                                <label class="form-label-dark">Họ tên *</label>
                                <input type="text" name="hoTen" class="form-control-dark form-control"
                                       placeholder="Nguyễn Văn A" required/>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label-dark">Email *</label>
                                <input type="email" name="email" class="form-control-dark form-control"
                                       placeholder="email@utccinema.vn" required/>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label-dark">Số điện thoại</label>
                                <input type="text" name="sdt" class="form-control-dark form-control" placeholder="0901234567"/>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label-dark">Chức vụ *</label>
                                <select name="chucVu" class="form-control-dark form-select" required>
                                    <option value="NHAN_VIEN">Nhân viên</option>
                                    <option value="QUAN_LY">Quản lý</option>
                                </select>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label-dark">Rạp chiếu *</label>
                                <select name="maRap" class="form-control-dark form-select" required>
                                    <option value="">-- Chọn rạp --</option>
                                    <option th:each="r : ${danhSachRap}" th:value="${r.maRap}" th:text="${r.tenRap}"></option>
                                </select>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label-dark">Mật khẩu * (tối thiểu 6 ký tự)</label>
                                <input type="password" name="matKhau" class="form-control-dark form-control" minlength="6" required/>
                            </div>
                        </div>
                    </div>
                    <div class="modal-footer" style="border-color:#2a2a2a">
                        <button type="button" class="btn-cinema-outline" data-bs-dismiss="modal">Hủy</button>
                        <button type="submit" class="btn-cinema"><i class="fas fa-save"></i>Lưu</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Modal Sua nhan vien -->
    <div class="modal fade" id="editStaffModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-lg">
            <div class="modal-content" style="background:#1a1a1a;border:1px solid #2a2a2a;color:#fff">
                <div class="modal-header" style="border-color:#2a2a2a">
                    <h5 class="modal-title"><i class="fas fa-user-edit me-2" style="color:#5b9bd5"></i>Sửa thông tin nhân viên</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <form th:action="@{/admin/nhan-vien/sua}" method="post" id="editStaffForm">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                    <input type="hidden" name="maNv" id="editMaNv"/>
                    <div class="modal-body">
                        <div class="row g-3">
                            <div class="col-md-6">
                                <label class="form-label-dark">Họ tên *</label>
                                <input type="text" name="hoTen" id="editHoTen" class="form-control-dark form-control" required/>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label-dark">Email *</label>
                                <input type="email" name="email" id="editEmail" class="form-control-dark form-control" required/>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label-dark">Số điện thoại</label>
                                <input type="text" name="sdt" id="editSdt" class="form-control-dark form-control"/>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label-dark">Chức vụ *</label>
                                <select name="chucVu" id="editChucVu" class="form-control-dark form-select" required>
                                    <option value="NHAN_VIEN">Nhân viên</option>
                                    <option value="QUAN_LY">Quản lý</option>
                                </select>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label-dark">Rạp chiếu *</label>
                                <select name="maRap" id="editMaRap" class="form-control-dark form-select" required>
                                    <option th:each="r : ${danhSachRap}" th:value="${r.maRap}" th:text="${r.tenRap}"></option>
                                </select>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label-dark">Mật khẩu mới (bỏ trống nếu không đổi)</label>
                                <input type="password" name="matKhauMoi" class="form-control-dark form-control" minlength="6"/>
                            </div>
                        </div>
                    </div>
                    <div class="modal-footer" style="border-color:#2a2a2a">
                        <button type="button" class="btn-cinema-outline" data-bs-dismiss="modal">Hủy</button>
                        <button type="submit" class="btn-cinema"><i class="fas fa-save"></i>Lưu</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
<th:block layout:fragment="scripts">
<script>
function openEditModal(maNv, hoTen, email, sdt, chucVu, maRap) {
    document.getElementById('editMaNv').value = maNv;
    document.getElementById('editHoTen').value = hoTen;
    document.getElementById('editEmail').value = email;
    document.getElementById('editSdt').value = sdt || '';
    document.getElementById('editChucVu').value = chucVu;
    document.getElementById('editMaRap').value = maRap || '';
    new bootstrap.Modal(document.getElementById('editStaffModal')).show();
}
</script>
</th:block>
</body>
</html>
