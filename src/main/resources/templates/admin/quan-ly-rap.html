<!DOCTYPE html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/admin-layout}">
<head layout:fragment="head-extra"></head>
<body>
<div layout:fragment="content">
    <div class="admin-topbar">
        <div class="admin-page-title"><i class="fas fa-building me-2" style="color:#e50914"></i>Quản lý rạp &amp; Phòng chiếu</div>
        <button class="btn-cinema" data-bs-toggle="modal" data-bs-target="#addRapModal">
            <i class="fas fa-plus"></i>Thêm rạp
        </button>
    </div>

    <div class="row g-3">
        <!-- Danh sach rap -->
        <div class="col-lg-5">
            <div class="card-dark">
                <h3 style="font-size:1rem;font-weight:700;margin-bottom:16px">Danh sách rạp chiếu</h3>
                <div th:each="rap : ${danhSachRap}"
                     class="d-flex align-items-center justify-content-between"
                     style="padding:12px;background:#111;border-radius:10px;margin-bottom:8px;border:1px solid #2a2a2a;transition:0.2s"
                     onmouseover="this.style.borderColor='#e50914'" onmouseout="this.style.borderColor='#2a2a2a'">
                    <div style="cursor:pointer;flex:1"
                         th:attr="data-rap-id=${rap.maRap},data-rap-ten=${rap.tenRap}"
                         onclick="loadPhong(this.getAttribute('data-rap-id'), this.getAttribute('data-rap-ten'))">
                        <div style="font-weight:700;font-size:0.9rem" th:text="${rap.tenRap}"></div>
                        <div style="color:#666;font-size:0.78rem;margin-top:2px" th:text="${rap.diaChi}"></div>
                        <div style="color:#b3b3b3;font-size:0.75rem;margin-top:2px">
                            <span th:text="${rap.phongChieus?.size() ?: 0}"></span> phòng
                        </div>
                    </div>
                    <div class="d-flex gap-1 ms-2">
                        <button th:attr="data-rap-id=${rap.maRap},data-rap-ten=${rap.tenRap}"
                                onclick="openAddPhongModal(this)"
                                style="background:#1a1a1a;border:1px solid #333;color:#f5c518;padding:5px 10px;border-radius:6px;cursor:pointer;font-size:0.78rem"
                                title="Thêm phòng chiếu">
                            <i class="fas fa-door-open"></i>
                        </button>
                        <form th:action="@{/admin/rap-chieu/xoa/{id}(id=${rap.maRap})}" method="post" style="display:inline"
                              onsubmit="return confirm('Xóa rạp này? Tất cả phòng chiếu liên quan sẽ bị xóa!')">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                            <button type="submit"
                                    style="background:#1a1a1a;border:1px solid #333;color:#e50914;padding:5px 10px;border-radius:6px;cursor:pointer;font-size:0.78rem">
                                <i class="fas fa-trash"></i>
                            </button>
                        </form>
                    </div>
                </div>
                <div th:if="${danhSachRap == null or danhSachRap.isEmpty()}" style="color:#444;text-align:center;padding:20px">Chưa có rạp nào</div>
            </div>
        </div>

        <!-- Phong theo rap -->
        <div class="col-lg-7">
            <div class="card-dark">
                <h3 style="font-size:1rem;font-weight:700;margin-bottom:16px" id="phongTitle">
                    Chọn rạp để xem phòng chiếu
                </h3>
                <div id="phongList">
                    <div style="color:#444;text-align:center;padding:32px">
                        <i class="fas fa-door-open" style="font-size:2rem;margin-bottom:8px;display:block"></i>
                        Chọn một rạp để xem danh sách phòng
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- ===== MODALS - PHAI nam trong layout:fragment="content" ===== -->

    <!-- Modal Thêm rạp -->
    <div class="modal fade" id="addRapModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content" style="background:#1a1a1a;border:1px solid #2a2a2a;color:#fff">
                <div class="modal-header" style="border-color:#2a2a2a">
                    <h5 class="modal-title"><i class="fas fa-building me-2" style="color:#e50914"></i>Thêm rạp chiếu mới</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <form th:action="@{/admin/rap-chieu/them}" method="post">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                    <div class="modal-body">
                        <div class="row g-3">
                            <div class="col-12">
                                <label class="form-label-dark">Tên rạp *</label>
                                <input type="text" name="tenRap" class="form-control-dark form-control"
                                       placeholder="UTC Cinema Hà Nội" required/>
                            </div>
                            <div class="col-12">
                                <label class="form-label-dark">Địa chỉ *</label>
                                <input type="text" name="diaChi" class="form-control-dark form-control"
                                       placeholder="123 Đường ABC, Quận X, TP.HCM" required/>
                            </div>
                            <div class="col-12">
                                <label class="form-label-dark">Số điện thoại</label>
                                <input type="text" name="sdt" class="form-control-dark form-control" placeholder="02812345678"/>
                            </div>
                        </div>
                    </div>
                    <div class="modal-footer" style="border-color:#2a2a2a">
                        <button type="button" class="btn-cinema-outline" data-bs-dismiss="modal">Hủy</button>
                        <button type="submit" class="btn-cinema"><i class="fas fa-save"></i>Lưu</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Modal Thêm phòng chiếu -->
    <div class="modal fade" id="addPhongModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content" style="background:#1a1a1a;border:1px solid #2a2a2a;color:#fff">
                <div class="modal-header" style="border-color:#2a2a2a">
                    <h5 class="modal-title"><i class="fas fa-door-open me-2" style="color:#f5c518"></i>Thêm phòng chiếu</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <form th:action="@{/admin/phong-chieu/them}" method="post">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                    <input type="hidden" name="maRap" id="addPhongRapId"/>
                    <div class="modal-body">
                        <div style="background:#111;padding:10px;border-radius:8px;margin-bottom:16px;font-size:0.85rem;color:#b3b3b3">
                            Rạp: <strong id="addPhongRapTen" style="color:#fff"></strong>
                        </div>
                        <div class="row g-3">
                            <div class="col-md-8">
                                <label class="form-label-dark">Tên phòng *</label>
                                <input type="text" name="tenPhong" class="form-control-dark form-control" placeholder="Phòng 1" required/>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label-dark">Sức chứa (ghế) *</label>
                                <input type="number" name="sucChua" class="form-control-dark form-control" placeholder="120" min="1" required/>
                            </div>
                            <div class="col-12">
                                <label class="form-label-dark">Loại phòng</label>
                                <select name="loaiPhong" class="form-control-dark form-select">
                                    <option value="Thuong">Thường (2D)</option>
                                    <option value="VIP">VIP</option>
                                    <option value="IMAX">IMAX</option>
                                    <option value="4DX">4DX</option>
                                    <option value="Dolby">Dolby Atmos</option>
                                </select>
                            </div>
                        </div>
                    </div>
                    <div class="modal-footer" style="border-color:#2a2a2a">
                        <button type="button" class="btn-cinema-outline" data-bs-dismiss="modal">Hủy</button>
                        <button type="submit" class="btn-cinema"><i class="fas fa-save"></i>Lưu</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<th:block layout:fragment="scripts">
<script>
function openAddPhongModal(btn) {
    var maRap = btn.getAttribute('data-rap-id');
    var tenRap = btn.getAttribute('data-rap-ten');
    document.getElementById('addPhongRapId').value = maRap || '';
    document.getElementById('addPhongRapTen').textContent = tenRap || maRap || '';
    var modal = new bootstrap.Modal(document.getElementById('addPhongModal'));
    modal.show();
}

function loadPhong(maRap, tenRap) {
    if (!maRap) return;
    document.getElementById('phongTitle').textContent = 'Phòng chiếu - ' + (tenRap || maRap);
    var list = document.getElementById('phongList');
    list.innerHTML = '<div style="text-align:center;color:#666;padding:20px"><i class="fas fa-spinner fa-spin"></i> Đang tải...</div>';

    fetch('/admin/rap-chieu/' + encodeURIComponent(maRap) + '/phong')
        .then(function(r) {
            if (!r.ok) throw new Error('HTTP ' + r.status);
            return r.json();
        })
        .then(function(data) {
            if (!data || data.length === 0) {
                list.innerHTML = '<div style="color:#444;text-align:center;padding:32px"><i class="fas fa-door-open" style="font-size:2rem;display:block;margin-bottom:8px"></i>Chưa có phòng chiếu nào</div>';
                return;
            }
            var html = '';
            for (var i = 0; i < data.length; i++) {
                var p = data[i];
                html += '<div style="display:flex;align-items:center;justify-content:space-between;padding:12px;background:#111;border-radius:10px;margin-bottom:8px;border:1px solid #2a2a2a">' +
                    '<div>' +
                        '<div style="font-weight:700;font-size:0.9rem">' + (p.tenPhong || '') + '</div>' +
                        '<div style="color:#666;font-size:0.78rem;margin-top:2px">' + (p.loaiPhong || 'Thuong') + ' &nbsp;\u2022&nbsp; ' + (p.sucChua || 0) + ' ghe</div>' +
                    '</div>' +
                    '<span class="badge-status badge-success" style="font-size:0.72rem">Hoạt động</span>' +
                '</div>';
            }
            list.innerHTML = html;
        })
        .catch(function(err) {
            list.innerHTML = '<div style="color:#e50914;text-align:center;padding:20px">Loi tai du lieu: ' + err.message + '</div>';
        });
}
</script>
</th:block>
</body>
</html>
