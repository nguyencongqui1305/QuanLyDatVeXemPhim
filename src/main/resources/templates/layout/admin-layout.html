<!DOCTYPE html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title th:text="${pageTitle ?: 'Admin - UTC Cinema'}">Admin UTC Cinema</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"/>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
    <th:block layout:fragment="head-extra"></th:block>
</head>
<body>

<div class="admin-layout">
    <!-- SIDEBAR -->
    <aside class="admin-sidebar">
        <div class="sidebar-logo">
            <i class="fas fa-film me-2"></i>UTC Admin
        </div>
        <nav class="sidebar-menu">
            <div class="sidebar-section">Tổng quan</div>
            <a th:href="@{/admin}" th:class="${currentURI.startsWith('/admin') and currentURI == '/admin' ? 'sidebar-item active' : 'sidebar-item'}">
                <i class="fas fa-tachometer-alt"></i> Dashboard
            </a>

            <div class="sidebar-section">Nội dung</div>
            <a th:href="@{/admin/phim}" th:class="${currentURI.contains('/admin/phim') ? 'sidebar-item active' : 'sidebar-item'}" sec:authorize="hasRole('QUAN_LY')">
                <i class="fas fa-film"></i> Quản lý phim
            </a>
            <a th:href="@{/admin/lich-chieu}" th:class="${currentURI.contains('/admin/lich-chieu') ? 'sidebar-item active' : 'sidebar-item'}" sec:authorize="hasRole('QUAN_LY')">
                <i class="fas fa-calendar-alt"></i> Lịch chiếu
            </a>
            <a th:href="@{/admin/rap-chieu}" th:class="${currentURI.contains('/admin/rap-chieu') ? 'sidebar-item active' : 'sidebar-item'}">
                <i class="fas fa-building"></i> Rạp & Phòng chiếu
            </a>

            <div class="sidebar-section">Khách hàng</div>
            <a th:href="@{/admin/khach-hang}" th:class="${currentURI.contains('/admin/khach-hang') ? 'sidebar-item active' : 'sidebar-item'}">
                <i class="fas fa-users"></i> Khách hàng
            </a>
            <a th:href="@{/admin/nhan-vien}" th:class="${currentURI.contains('/admin/nhan-vien') ? 'sidebar-item active' : 'sidebar-item'}" sec:authorize="hasRole('QUAN_LY')">
                <i class="fas fa-user-tie"></i> Nhân viên
            </a>

            <div class="sidebar-section">Vận hành</div>
            <a th:href="@{/admin/dat-ve}" th:class="${currentURI.contains('/admin/dat-ve') ? 'sidebar-item active' : 'sidebar-item'}">
                <i class="fas fa-ticket-alt"></i> Quản lý đặt vé
            </a>
            <a th:href="@{/admin/thanh-toan}" th:class="${currentURI.contains('/admin/thanh-toan') ? 'sidebar-item active' : 'sidebar-item'}">
                <i class="fas fa-money-bill-wave"></i> Thanh toán
            </a>
            <a th:href="@{/admin/khuyen-mai}" th:class="${currentURI.contains('/admin/khuyen-mai') ? 'sidebar-item active' : 'sidebar-item'}" sec:authorize="hasRole('QUAN_LY')">
                <i class="fas fa-tags"></i> Khuyến mãi
            </a>
            <a th:href="@{/admin/bao-cao}" th:class="${currentURI.contains('/admin/bao-cao') ? 'sidebar-item active' : 'sidebar-item'}" sec:authorize="hasRole('QUAN_LY')">
                <i class="fas fa-chart-bar"></i> Báo cáo
            </a>

            <div class="sidebar-section">Tài khoản</div>
            <a th:href="@{/}" class="sidebar-item">
                <i class="fas fa-home"></i> Về trang chủ
            </a>
            <form th:action="@{/logout}" method="post" style="margin:0">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                <button type="submit" class="sidebar-item" style="width:100%;background:none;border:none;color:#e50914;cursor:pointer;text-align:left">
                    <i class="fas fa-sign-out-alt"></i> Đăng xuất
                </button>
            </form>
        </nav>
        <div style="padding:16px;border-top:1px solid #2a2a2a;font-size:0.78rem;color:#666">
            <div sec:authentication="principal.hoTen" style="color:#b3b3b3;font-weight:600"></div>
            <div sec:authentication="principal.chucVu" style="color:#666"></div>
        </div>
    </aside>

    <!-- MAIN CONTENT -->
    <main class="admin-content">
        <!-- Flash messages -->
        <div th:if="${successMessage}" class="alert" style="background:rgba(70,211,105,0.1);border:1px solid rgba(70,211,105,0.3);color:#46d369;border-radius:10px;padding:12px 16px;margin-bottom:16px;display:flex;align-items:center;gap:8px">
            <i class="fas fa-check-circle"></i>
            <span th:text="${successMessage}"></span>
        </div>
        <div th:if="${errorMessage}" class="alert" style="background:rgba(229,9,20,0.1);border:1px solid rgba(229,9,20,0.3);color:#ff4d4d;border-radius:10px;padding:12px 16px;margin-bottom:16px;display:flex;align-items:center;gap:8px">
            <i class="fas fa-exclamation-circle"></i>
            <span th:text="${errorMessage}"></span>
        </div>

        <div layout:fragment="content">
            <!-- Admin page content -->
        </div>
    </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/main.js}"></script>
<th:block layout:fragment="scripts"></th:block>
</body>
</html>
