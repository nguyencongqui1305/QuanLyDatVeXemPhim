<!DOCTYPE html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/main-layout}">
<head layout:fragment="head-extra">
<style>
.error-glitch {
    position: relative;
    display: inline-block;
    font-size: 8rem;
    font-weight: 900;
    color: #e50914;
    text-shadow: 0 0 60px rgba(229,9,20,0.5);
    animation: glitch 3s infinite;
    line-height: 1;
}
@keyframes glitch {
    0%,90%,100% { clip-path: none; transform: none; }
    91% { clip-path: inset(30% 0 50% 0); transform: translate(-3px, 0); color: #ff4d4d; }
    93% { clip-path: inset(60% 0 10% 0); transform: translate(3px, 0); color: #f5c518; }
    95% { clip-path: none; transform: none; color: #e50914; }
}
.error-container {
    min-height: calc(100vh - 180px);
    display: flex; align-items: center; justify-content: center;
    background: radial-gradient(ellipse at center, #1a0000 0%, #0d0d0d 70%);
    padding: 40px 20px;
}
.error-content {
    text-align: center;
    max-width: 600px;
    animation: fadeInUp 0.5s ease;
}
.error-dots {
    display: flex; justify-content: center; gap: 8px; margin: 28px 0;
}
.error-dot {
    width: 10px; height: 10px; border-radius: 50%;
    background: #2a2a2a; animation: dotPulse 1.5s infinite;
}
.error-dot:nth-child(2) { animation-delay: 0.2s; }
.error-dot:nth-child(3) { animation-delay: 0.4s; }
@keyframes dotPulse {
    0%,100% { background: #2a2a2a; transform: scale(1); }
    50% { background: #e50914; transform: scale(1.3); }
}
</style>
</head>
<body>
<main layout:fragment="content">
<div class="error-container">
    <div class="error-content">
        <!-- Error code display -->
        <div class="error-glitch" th:text="${errorCode ?: '4○4'}">4○4</div>

        <!-- Animated dots -->
        <div class="error-dots">
            <div class="error-dot"></div>
            <div class="error-dot"></div>
            <div class="error-dot"></div>
        </div>

        <!-- Title -->
        <h1 style="font-size:1.8rem;font-weight:700;margin-bottom:12px"
            th:text="${errorTitle ?: 'Có lỗi xảy ra'}">Có lỗi xảy ra</h1>

        <!-- Message -->
        <p style="color:#666;font-size:0.95rem;line-height:1.7;margin-bottom:32px;max-width:420px;margin-left:auto;margin-right:auto"
           th:text="${errorMessage ?: 'Đã có lỗi không xác định. Vui lòng thử lại sau.'}">
        </p>

        <!-- Context-based suggestion -->
        <div th:if="${errorCode == '404'}"
             style="background:#1a1a1a;border:1px solid #2a2a2a;border-radius:12px;padding:20px;margin-bottom:28px;text-align:left">
            <div style="font-size:0.8rem;color:#555;text-transform:uppercase;letter-spacing:1px;margin-bottom:12px">
                <i class="fas fa-lightbulb me-2" style="color:#f5c518"></i>Gợi ý
            </div>
            <div style="font-size:0.88rem;color:#b3b3b3;line-height:1.8">
                • Kiểm tra lại URL đường dẫn<br>
                • Trang này có thể đã bị xóa hoặc thay đổi<br>
                • Quay lại trang chủ để tìm phim bạn muốn xem
            </div>
        </div>

        <!-- Action buttons -->
        <div class="d-flex gap-3 justify-content-center flex-wrap">
            <a th:href="@{/}" class="btn-cinema" style="padding:12px 28px">
                <i class="fas fa-home"></i>Về trang chủ
            </a>
            <button onclick="history.back()" class="btn-cinema-outline" style="padding:12px 24px">
                <i class="fas fa-arrow-left"></i>Quay lại
            </button>
            <a th:href="@{/tim-kiem}" class="btn-cinema-outline" style="padding:12px 24px">
                <i class="fas fa-search"></i>Tìm phim
            </a>
        </div>

        <!-- Footer note -->
        <div style="margin-top:40px;font-size:0.78rem;color:#333">
            UTC Cinema &mdash; Nếu lỗi tiếp tục xảy ra, vui lòng liên hệ hỗ trợ.
        </div>
    </div>
</div>
</main>
</body>
</html>
